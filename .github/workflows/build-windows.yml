name: Build Merci Player for Windows
# Windows CI validates player, media, lyrics, and desktop integration updates.

on:
  workflow_dispatch:
  push:
    branches: [main, master, redesign/immersive-player, feature/vlc-interface-windows-media-session, feature/complete-player-workflow, fix-native-folder-shortcut, feature/smooth-seek-timeline, feature/lrclib-minimal-player, feature/lyrics-sync-fullscreen-player-controls, feature/bottom-video-controls-album-art-previews, fix/blank-startup-screen]
    tags: ["v*"]
    paths:
      - "src/**"
      - "public/**"
      - "electron/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable executable
        run: npm run dist:win
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Merci-Player-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Merci Player ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.exe
