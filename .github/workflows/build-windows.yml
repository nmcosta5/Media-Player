name: Build Merci Player for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable executable
        run: npm run dist:win
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Merci-Player-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
